<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Absolute Note</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f5; --surface: #fff; --text: #333; --title: #444; --border: #ddd;
      --hover: #e3f2fd; --hover-border: #90caf9; --active: #bbdefb; --card-shadow: rgba(0, 0, 0, 0.15);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1e1f22; --surface: #2b2d31; --text: #e4e4e4; --title: #e8e8e8; --border: #444;
      --hover: #1c3a52; --hover-border: #3a79a8; --active: #24506f; --card-shadow: rgba(0, 0, 0, 0.5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 2px 12px var(--card-shadow);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      color: var(--title);
      margin-bottom: 20px;
    }
    section { margin-bottom: 20px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
      transition: background 0.12s, border-color 0.12s;
      text-align: left;
    }
    .btn:hover { background: var(--hover); border-color: var(--hover-border); }
    .btn:active { background: var(--active); }
    .btn .ico { font-size: 18px; width: 22px; text-align: center; }
    .btn .label { flex: 1; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 26px;
      padding-top: 4px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      border: 3px solid var(--border);
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .btn:disabled { opacity: 0.5; cursor: default; background: var(--surface); border-color: var(--border); }
    .search {
      width: 100%; padding: 10px 12px; margin-bottom: 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text); font-size: 14px;
    }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .toolbar .btn { width: auto; padding: 6px 10px; font-size: 13px; }
    .count { margin-left: auto; font-size: 13px; color: var(--title); }
    .list {
      list-style: none; max-height: 280px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px;
    }
    .list li { border-bottom: 1px solid var(--border); }
    .list li:last-child { border-bottom: 0; }
    .list label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; }
    .list label:hover { background: var(--hover); }
    .list .url { flex: 1; font-size: 13px; word-break: break-all; }
    .list .n { font-size: 12px; opacity: 0.7; }
    .btn-danger { color: #c00; }
    .list .url a { color: inherit; }
    .empty { padding: 14px; text-align: center; font-size: 13px; opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="lbl-title">Data</h1>

    <section>
      <input type="search" id="search" class="search" autocomplete="off">
      <div class="toolbar">
        <button class="btn" id="btn-select-all" type="button"></button>
        <button class="btn" id="btn-deselect-all" type="button"></button>
        <span class="count" id="count"></span>
      </div>
      <ul class="list" id="list"></ul>
      <button class="btn" id="btn-export" type="button">
        <span class="ico">&darr;</span>
        <span class="label" id="lbl-export">Export selected (JSON)</span>
      </button>
      <button class="btn btn-danger" id="btn-delete" type="button" style="margin-top: 8px">
        <span class="ico">&#10005;</span>
        <span class="label" id="lbl-delete">Delete selected</span>
      </button>
    </section>

    <section>
      <button class="btn" id="btn-import" type="button">
        <span class="ico">&uarr;</span>
        <span class="label" id="lbl-import">Import notes (JSON)</span>
      </button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
    </section>

    <div class="status-row">
      <div class="spinner" id="spinner" hidden></div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script src="data.js"></script>
</body>
</html>
