<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Absolute Note — Outline</title>
    <style>
      :root {
        --an-bg: #fff;
        --an-border: #e4e4e4;
        --an-text: #333;
        --an-muted: #777;
        --an-accent: #1565c0;
        --an-danger: #c00;
        --an-hover: #f5f5f5;
        --an-icon-hover: rgba(0,0,0,0.08);
        --an-accent-hover: #0d47a1;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --an-bg: #2b2d31;
        --an-border: #444;
        --an-text: #e4e4e4;
        --an-muted: #aaa;
        --an-accent: #1565c0;
        --an-danger: #ef9a9a;
        --an-hover: #383a40;
        --an-icon-hover: rgba(255,255,255,0.12);
        --an-accent-hover: #1976d2;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        color: var(--an-text);
        background: var(--an-bg);
        display: flex;
        flex-direction: column;
      }
      [hidden] { display: none !important; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid var(--an-border);
        flex-shrink: 0;
      }
      header .title { font-weight: 600; font-size: 14px; }
      #empty { color: var(--an-muted); padding: 24px 16px; text-align: center; }
      #lost { color: var(--an-danger); padding: 24px 16px; text-align: center; }
      .notes { margin: 0; padding: 8px 0; flex: 1; overflow-y: auto; }
      .absolute-note-outline-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 12px;
        cursor: pointer;
        transition: background 0.12s;
      }
      .absolute-note-outline-item:hover { background: var(--an-hover); }
      .absolute-note-outline-dot { flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid; margin-top: 3px; }
      .absolute-note-outline-label { word-break: break-word; line-height: 1.4; flex: 1; }
      .absolute-note-outline-lock,
      .absolute-note-outline-edit,
      .absolute-note-outline-del {
        flex-shrink: 0;
        width: 18px; height: 18px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 13px; color: var(--an-muted); cursor: pointer; border-radius: 50%;
      }
      .absolute-note-outline-lock:hover,
      .absolute-note-outline-edit:hover,
      .absolute-note-outline-del:hover { background: var(--an-icon-hover); color: var(--an-accent); }
      .absolute-note-outline-del:hover { color: var(--an-danger); }
      .words { padding: 6px 10px 0; font-size: 12px; color: var(--an-muted); text-align: right; flex-shrink: 0; }
      .add-wrap { padding: 10px; border-top: 1px solid var(--an-border); flex-shrink: 0; }
      .add {
        width: 100%; padding: 8px 12px; border: none; border-radius: 4px;
        background: var(--an-accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      }
      .add:hover { background: var(--an-accent-hover); }
    </style>
  </head>
  <body>
    <header>
      <span class="title" id="title">Outline</span>
    </header>
    <div id="empty" hidden></div>
    <div id="lost" hidden></div>
    <div class="notes" id="notes"></div>
    <div class="words" id="words"></div>
    <div class="add-wrap">
      <button type="button" class="add" id="add-note"></button>
    </div>
    <script src="outline.js"></script>
  </body>
</html>
