<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Absolute Note</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 220px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      color: #333;
      padding: 8px;
    }
    h1 {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      padding: 8px 0 10px;
      color: #444;
      border-bottom: 1px solid #ddd;
      margin-bottom: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 4px;
      border: none;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      color: #333;
      transition: background 0.12s;
      text-align: left;
    }
    .btn:hover { background: #e3f2fd; }
    .btn:active { background: #bbdefb; }
    .btn .ico { font-size: 16px; width: 20px; text-align: center; }
    .btn .label { flex: 1; }
    .btn--disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }
    .btn--disabled:hover { background: #fff; }
    .btn--disabled:active { background: #fff; }
    hr { border: none; border-top: 1px solid #ddd; margin: 6px 0; }
    .footer {
      font-size: 11px;
      color: #999;
      text-align: center;
      padding-top: 6px;
    }
    .lang-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 0 4px;
      font-size: 12px;
      color: #666;
    }
    .lang-row select {
      font-size: 12px;
      padding: 2px 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      color: #333;
    }
    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .field input {
      width: 76px;
      padding: 5px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      text-align: right;
    }
    .status {
      min-height: 16px;
      font-size: 12px;
      text-align: center;
      padding: 4px 2px 0;
    }
  </style>
</head>
<body>
  <div id="main-view">
    <h1>Absolute Note</h1>

    <button class="btn" id="btn-hide">
      <span class="ico" id="ico-hide"></span>
      <span class="label" id="lbl-hide">Hide all notes</span>
    </button>

    <button class="btn" id="btn-outline">
      <span class="ico">&#9776;</span>
      <span class="label" id="lbl-outline">View Outline</span>
    </button>

    <button class="btn" id="btn-customize">
      <span class="ico">&#9881;</span>
      <span class="label" id="lbl-customize">Customize notes</span>
    </button>

    <hr>

    <button class="btn" id="btn-export">
      <span class="ico">&darr;</span>
      <span class="label" id="lbl-export">Export notes (JSON)</span>
    </button>

    <button class="btn" id="btn-import">
      <span class="ico">&uarr;</span>
      <span class="label" id="lbl-import">Import notes (JSON)</span>
    </button>

    <div class="lang-row">
      <span id="lbl-lang">Language:</span>
      <select id="lang-select">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </div>

    <div class="footer">v1.0.0</div>
    <div id="status" class="status"></div>
  </div>

  <div id="settings-view" style="display:none">
    <h1 id="lbl-prefs-title">Customize notes</h1>

    <div class="field">
      <label id="lbl-prefs-width">Width (px)</label>
      <input type="number" id="in-width" min="80" max="2000" step="1">
    </div>

    <div class="field">
      <label id="lbl-prefs-height">Height (px)</label>
      <input type="number" id="in-height" min="80" max="2000" step="1">
    </div>

    <div class="field">
      <label id="lbl-prefs-font">Font size (px)</label>
      <input type="number" id="in-font" min="8" max="72" step="1">
    </div>

    <button class="btn" id="btn-prefs-save">
      <span class="ico">&#10003;</span>
      <span class="label">Save</span>
    </button>

    <button class="btn" id="btn-prefs-back">
      <span class="ico">&larr;</span>
      <span class="label">Back</span>
    </button>

    <div id="prefs-status" class="status"></div>
  </div>

  <script src="locales.js"></script>
  <script src="sanitize.js"></script>
  <script src="popup.js"></script>
</body>
</html>
