<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Absolute Note — Outline</title>
    <style>
      :root {
        --an-bg: #fff;
        --an-border: #e4e4e4;
        --an-text: #333;
        --an-muted: #777;
        --an-accent: #1565c0;
        --an-danger: #c00;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        color: var(--an-text);
        background: var(--an-bg);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid var(--an-border);
        flex-shrink: 0;
      }
      header .title { font-weight: 600; font-size: 14px; }
      #empty { color: var(--an-muted); padding: 24px 16px; text-align: center; }
      #lost { color: var(--an-danger); padding: 24px 16px; text-align: center; display: none; }
      ul.notes { list-style: none; margin: 0; padding: 8px 0; flex: 1; overflow-y: auto; }
      li.item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 12px;
        cursor: pointer;
        transition: background 0.12s;
      }
      li.item:hover { background: #f5f5f5; }
      .dot { flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid; margin-top: 3px; }
      .label { word-break: break-word; line-height: 1.4; flex: 1; }
      .act {
        flex-shrink: 0;
        width: 18px; height: 18px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 13px; color: var(--an-muted); cursor: pointer; border-radius: 50%;
      }
      .act:hover { background: rgba(0,0,0,0.08); color: var(--an-accent); }
      .act.del:hover { color: var(--an-danger); }
      .add-wrap { padding: 10px; border-top: 1px solid var(--an-border); flex-shrink: 0; }
      .add {
        width: 100%; padding: 8px 12px; border: none; border-radius: 4px;
        background: var(--an-accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      }
      .add:hover { background: #0d47a1; }
      #status { color: #2e7d32; padding: 4px 12px; min-height: 18px; font-size: 12px; flex-shrink: 0; }
    </style>
  </head>
  <body>
    <header>
      <span class="title" id="title">Outline</span>
    </header>
    <div id="empty" style="display:none"></div>
    <div id="lost" style="display:none"></div>
    <ul class="notes" id="notes"></ul>
    <div class="add-wrap">
      <button type="button" class="add" id="add-note"></button>
    </div>
    <div id="status"></div>
    <script src="locales.js"></script>
    <script src="outline.js"></script>
  </body>
</html>
